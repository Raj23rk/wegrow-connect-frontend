<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WeGrow B School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --blue:#0C3C8F; --blue-deep:#082B6A; --orange:#F28C1B; --ink:#1B2433; --muted:#5F6B7E;
  --paper:#FFFFFF; --paper-tint:#F4F7FC; --line:#DCE4F0; --wash:#EAF1FB;
  --bg:#E7ECF3; --bg-ink:#2A3446; --ctrl:#FFFFFF; --ctrl-ink:#0C3C8F; --ctrl-line:#CFD8E6;
  --heading:'Sora', 'Segoe UI', system-ui, sans-serif;
  --body:'Manrope', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0E1422; --bg-ink:#C9D3E3; --ctrl:#1A2336; --ctrl-ink:#E6ECF7; --ctrl-line:#2C3850; }
}
:root[data-theme="dark"]{ --bg:#0E1422; --bg-ink:#C9D3E3; --ctrl:#1A2336; --ctrl-ink:#E6ECF7; --ctrl-line:#2C3850; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--bg-ink);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden;
  background-image:radial-gradient(ellipse at 50% 40%, rgba(12,60,143,.10), transparent 65%);}
.viewer{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative;touch-action:pan-y pinch-zoom}
.stage{position:relative}
.scaler{position:absolute;left:0;top:0;transform-origin:0 0}
.book{position:relative;perspective:2600px;transition:transform .7s cubic-bezier(.3,.7,.3,1)}
.leaf{position:absolute;top:0;transform-style:preserve-3d;transform-origin:left center;
  transition:transform .8s cubic-bezier(.45,.05,.25,1), opacity .2s linear .6s;cursor:pointer}
.leaf.flipped{transform:rotateY(-180deg)}
.single .leaf{transition:transform .65s cubic-bezier(.45,.05,.25,1), opacity 0s;opacity:1}
.single .leaf.flipped{opacity:0;transition:transform .65s cubic-bezier(.45,.05,.25,1), opacity .15s linear .5s}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:var(--paper);
  box-shadow:0 10px 24px -14px rgba(8,25,60,.35), 0 1px 3px rgba(8,25,60,.10)}
.face.back{transform:rotateY(180deg)}
.face::after{content:"";position:absolute;inset:0;pointer-events:none}
.spread .face.front::after{background:linear-gradient(90deg, rgba(0,0,0,.14), rgba(0,0,0,.03) 4%, transparent 9%)}
.spread .face.back::after{background:linear-gradient(270deg, rgba(0,0,0,.14), rgba(0,0,0,.03) 4%, transparent 9%)}
.blank{background:var(--paper-tint)}

/* ---------- controls ---------- */
.bar{display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 16px 18px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--ctrl-line);background:var(--ctrl);color:var(--ctrl-ink);font:600 14px var(--body);
  height:42px;min-width:42px;padding:0 16px;border-radius:21px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.btn svg{width:18px;height:18px}
.where{font:600 14px var(--body);min-width:130px;text-align:center}
.dots{display:flex;gap:6px}
.dot{width:8px;height:8px;border-radius:4px;background:var(--ctrl-line);border:0;padding:0;cursor:pointer;transition:width .3s,background .3s}
.dot.on{width:22px;background:var(--orange)}
.dot:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.hint{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:12px;opacity:.6}
@media (max-width:520px){.dots{display:none}.where{min-width:80px;font-size:13px}.btn{height:38px;padding:0 14px;font-size:13px}.bar{gap:10px;padding:8px 12px 14px}}
@media (max-height:500px){.bar{padding:4px 12px 8px;gap:10px}.dots{display:none}.btn{height:34px}}
@media (prefers-reduced-motion: reduce){.leaf,.book{transition:none!important}}

/* ---------- page design (fixed 440 x 622 canvas) ---------- */
.pg{position:absolute;inset:0;font-family:var(--body);color:var(--ink);background:var(--paper-tint);display:flex;flex-direction:column}
.pg .band{height:10px;background:var(--blue);flex:none}
.pg .in{flex:1;padding:20px 30px 0;display:flex;flex-direction:column;min-height:0}
.pg .in>*{flex-shrink:0}
.pg .logo{width:104px;height:auto;display:block;border-radius:4px}
.pg h2{font:800 22px/1.15 var(--heading);color:var(--blue);margin:14px 0 5px;letter-spacing:-.4px}
.pg .sub{font-size:11.5px;line-height:1.4;color:var(--muted);margin:0 0 9px}
.pg .rule{width:64px;height:3px;background:var(--orange);border-radius:2px;margin-bottom:14px}
.pg .lead{font-size:12px;line-height:1.5;margin:0 0 12px}
.pg .foot{flex:none;display:flex;justify-content:space-between;align-items:center;margin:0 30px;padding:10px 0 14px;border-top:1px solid var(--line);font-size:10px;color:var(--muted);letter-spacing:.2px}
.pg .foot b{font-weight:700;color:var(--blue)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.card h3{font:700 12.5px/1.25 var(--heading);color:var(--blue);margin:6px 0 5px}
.card p{font-size:10.5px;line-height:1.45;margin:0;color:#3A4455}
.chip{display:block;width:22px;height:5px;border-radius:3px}
.banner{background:var(--blue);color:#fff;border-radius:10px;padding:14px 16px;text-align:center;font:700 13px var(--heading);letter-spacing:.3px}
.callout{background:var(--wash);border:1px solid var(--line);border-radius:10px;padding:14px 16px;color:var(--blue);font:700 13px/1.4 var(--heading);text-align:center}
.mt-auto{margin-top:auto}
.spacer{flex:1}
.pad-b{margin-bottom:14px}

/* cover */
.cover{background:#fff}
.cover .top{height:34px;background:var(--blue)}
.cover .logo-box{position:absolute;left:34px;top:14px;background:#fff;padding:6px 10px;border-radius:6px;box-shadow:0 6px 16px rgba(8,43,106,.18)}
.cover .logo-box img{width:150px;display:block}
.cover h1{position:absolute;left:34px;right:34px;top:120px;margin:0;font:800 33px/1.08 var(--heading);letter-spacing:-.8px;color:var(--blue)}
.cover h1 span{display:block;color:var(--orange)}
.cover .tag{position:absolute;left:34px;top:262px;width:230px;font-size:13px;line-height:1.55;margin:0}
.cover .mascot{position:absolute;right:-18px;bottom:40px;width:250px}
.cover .motto{position:absolute;left:34px;bottom:78px;width:222px;background:var(--wash);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.cover .motto b{display:block;font:800 16px var(--heading);color:var(--blue);margin-bottom:6px}
.cover .motto span{font-size:11px;line-height:1.5}
.cover .cfoot{position:absolute;left:34px;right:34px;bottom:30px;display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted)}
.cover .cfoot b{color:var(--blue)}
.cover .bottom{position:absolute;left:0;right:0;bottom:0;height:14px;background:var(--orange)}

/* about */
.about-card{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 6px 14px 16px;margin-bottom:12px}
.about-card .txt{flex:1}
.about-card .big{font-size:12.5px;line-height:1.5;margin:0 0 10px}
.about-card .small{font-size:10.5px;line-height:1.5;margin:0;color:#3A4455}
.about-card img{width:108px;flex:none}
.belief{background:var(--blue);color:#fff;border-radius:12px;padding:16px 18px}
.belief small{display:block;color:var(--orange);font-weight:700;font-size:11px;margin-bottom:8px}
.belief p{margin:0;font:600 13.5px/1.42 var(--heading)}

/* timeline */
.steps{position:relative;margin:0 0 12px}
.steps::before{content:"";position:absolute;left:17px;top:18px;bottom:18px;width:2px;background:var(--line)}
.step{position:relative;display:grid;grid-template-columns:36px 86px 1fr;align-items:center;gap:10px;padding:6px 0}
.step i{font-style:normal;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 12px var(--heading);background:var(--orange);z-index:1}
.step:nth-child(even) i{background:var(--blue)}
.step b{font:700 13px var(--heading);color:var(--blue)}
.step span{font-size:11px;line-height:1.4}

/* diagnostic */
.diag{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-bottom:12px}
.diag .card{padding:13px}
.diag ul{margin:10px 0 0;padding:0;list-style:none}
.diag li{font-size:10.5px;line-height:1.4;padding-left:13px;position:relative;margin-bottom:6px}
.diag li::before{content:"";position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:50%;background:var(--orange)}
.ready{background:var(--blue);color:#fff;border-radius:10px;padding:16px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:10px}
.ready h3{color:var(--orange)!important;margin:0!important}
.ready p{font-size:10.5px;line-height:1.5;margin:0}
.ready a{color:#fff;font-weight:700;font-size:13px;text-decoration:none}
.bring{position:relative;background:var(--wash);border:1px solid var(--line);border-radius:10px;padding:12px 130px 12px 16px;min-height:96px}
.bring small{color:var(--orange);font-weight:700;font-size:11px}
.bring ol{margin:8px 0 0;padding-left:18px;font:700 12.5px/1.6 var(--heading);color:var(--blue)}
.bring img{position:absolute;right:0;bottom:-8px;width:118px}

/* people */
.cap{display:flex;gap:10px;align-items:flex-start}
.cap .d{width:12px;height:12px;border-radius:50%;flex:none;margin-top:6px;background:var(--orange)}
.cap{padding:9px 10px}
.cap p{font-size:10px}
.cap.b .d{background:var(--blue)}
.cap h3{margin-top:4px}

/* trainers */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center}
.tile .ic{width:30px;height:30px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:var(--orange)}
.tile.b .ic{background:var(--blue)}
.tile .ic svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile h3{font:700 11px/1.25 var(--heading);color:var(--blue);margin:0 0 6px;min-height:28px;display:flex;align-items:center;justify-content:center}
.tile p{font-size:9.5px;line-height:1.4;margin:0;color:#3A4455}
.note{border:1.5px dashed #B9C7DD;border-radius:10px;padding:14px;text-align:center;font-size:11.5px;color:var(--muted);background:#fff}

/* clients */
.logos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.logo-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.logo-card .lw{height:62px;display:flex;align-items:center;justify-content:center}
.logo-card img{max-height:62px;max-width:150px}
.logo-card span{font:600 11px var(--heading);color:var(--ink)}
.logos .wide{grid-column:1 / -1}

/* why */
.why{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.why .row{display:grid;grid-template-columns:28px 104px 1fr;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.why i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font:700 11px var(--heading)}
.why b{font:700 11.5px var(--heading);color:var(--blue)}
.why span{font-size:11px;line-height:1.4}

/* ways */
.ways .card{padding:13px}
.ways .full{grid-column:1 / -1}

/* back cover */
.backc{background:var(--blue);color:#fff}
.backc .top{height:12px;background:var(--orange)}
.backc .logo-box{position:absolute;left:34px;top:36px;background:#fff;padding:6px 10px;border-radius:6px}
.backc .logo-box img{width:150px;display:block}
.backc h2{position:absolute;left:34px;right:34px;top:130px;margin:0;font:800 34px/1.08 var(--heading);color:#fff;letter-spacing:-.8px}
.backc .tagl{position:absolute;left:34px;top:212px;width:260px;margin:0;font-size:13.5px;line-height:1.55;color:#D6E1F5}
.backc .contact{position:absolute;left:34px;top:290px;width:236px;background:#fff;color:var(--ink);border-radius:14px;padding:18px 18px 16px}
.backc .contact h3{font:700 13px var(--heading);color:var(--orange);margin:0 0 12px}
.backc .contact small{display:block;font-size:10px;font-weight:700;color:var(--muted);margin-top:10px}
.backc .contact a,.backc .contact div{display:block;font-size:12.5px;margin-top:3px;color:var(--ink);text-decoration:none}
.backc .contact a{color:var(--blue);font-weight:700;font-size:14px}
.backc .contact .ph{color:#8A96A8;font-style:italic}
.backc .mascot{position:absolute;right:-34px;bottom:66px;width:205px}
.backc .bfoot{position:absolute;left:34px;right:34px;bottom:22px;font-size:10px;color:#C6D3EA}
.backc .bfoot b{display:block;font:700 12px var(--heading);color:#fff;margin-bottom:8px;letter-spacing:.2px}
.backc .bfoot div{display:flex;justify-content:space-between}

/* ---------- v2 additions ---------- */
.grid3 .tile{padding:9px 9px;text-align:left;display:grid;grid-template-columns:24px 1fr;gap:5px 7px;align-items:center}
.grid3 .tile p{grid-column:1/-1}
.grid3 .tile .ic{width:24px;height:24px;margin:0}
.grid3 .tile .ic svg{width:13px;height:13px}
.grid3 .tile h3{min-height:0;margin:0;font-size:10.5px;justify-content:flex-start;text-align:left}
.grid3 .tile p{font-size:9px;line-height:1.35}
.beyond{background:var(--blue);border-radius:12px;padding:9px 12px 10px;color:#fff}
.beyond.pad-b{margin-bottom:6px}
.beyond small{display:block;color:var(--orange);font:700 10.5px var(--heading);letter-spacing:.3px;margin-bottom:8px}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.bgrid>div{display:flex;gap:7px;align-items:flex-start}
.bgrid i{flex:none;width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.bgrid i svg{width:12px;height:12px;stroke:#FFB257;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bgrid p{margin:0;font-size:9px;line-height:1.3;color:#D5E0F4}
.bgrid b{display:block;color:#fff;font:700 10px/1.25 var(--heading);margin-bottom:2px}

.venn{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 10px 6px 16px}
.venn .vt{flex:1}
.venn .vt b{display:block;font:700 13px var(--heading);color:var(--blue);margin-bottom:4px}
.venn .vt span{font-size:11px;line-height:1.45;color:#3A4455}
.venn svg{width:112px;height:auto;flex:none}

.peek{display:flex;align-items:flex-end;justify-content:flex-end;gap:4px}
.peek img{width:80px;height:auto;display:block}
.bubble{position:relative;background:var(--wash);border:1px solid var(--line);border-radius:14px;padding:9px 14px;max-width:250px;margin-bottom:34px}
.bubble::after{content:"";position:absolute;right:-7px;bottom:14px;width:12px;height:12px;background:var(--wash);border-right:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.bubble b{display:block;font:700 12.5px var(--heading);color:var(--blue);margin-bottom:3px}
.bubble span{font-size:10.5px;line-height:1.45;color:#3A4455}

/* new cover */
.cv,.bk{background:radial-gradient(120% 80% at 85% 0%, #1A55C4 0%, #0C3C8F 45%, #06245C 100%);color:#fff;overflow:hidden}
.cv-dots,.bk-dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.16) 1px, transparent 1.3px);background-size:14px 14px;
  -webkit-mask-image:radial-gradient(70% 55% at 100% 0%, #000, transparent);mask-image:radial-gradient(70% 55% at 100% 0%, #000, transparent)}
.bk-dots{-webkit-mask-image:radial-gradient(70% 55% at 0% 100%, #000, transparent);mask-image:radial-gradient(70% 55% at 0% 100%, #000, transparent)}
.cv-rings,.bk-rings{position:absolute;width:300px;height:300px;fill:none;stroke:#F28C1B;stroke-width:1.2}
.cv-rings{right:-130px;top:-120px;opacity:.55}
.cv-rings .f{fill:rgba(242,140,27,.14);stroke:none}
.bk-rings{left:-150px;bottom:-60px;opacity:.35}
.cv-logo{position:absolute;left:30px;top:28px;background:#F3F4F7;border-radius:10px;padding:7px 11px;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.cv-logo img{width:132px;display:block}
.cv-ed{position:absolute;right:30px;top:34px;text-align:right;font:600 9px var(--body);letter-spacing:1.6px;text-transform:uppercase;color:rgba(255,255,255,.72)}
.cv-ed b{display:block;font:800 24px var(--heading);letter-spacing:0;color:#fff;margin-top:2px}
.cv-h{position:absolute;left:30px;right:30px;top:108px;margin:0;font:800 33px/1.08 var(--heading);letter-spacing:-.8px;color:#fff}
.cv-h em{display:block;font-style:normal;color:#FFA640}
.cv-tag{position:absolute;left:30px;top:268px;width:220px;margin:0;font-size:12.5px;line-height:1.55;color:#C9D7F2;padding-left:12px;border-left:3px solid #F28C1B}
.cv-steps{position:absolute;left:0;bottom:46px;width:440px;height:214px}
.cv-mascot{position:absolute;left:276px;bottom:202px;width:134px}
.cv-foot{position:absolute;left:0;right:0;bottom:0;height:46px;background:#fff;border-top:4px solid #F28C1B;display:flex;align-items:center;justify-content:space-between;padding:0 30px}
.cv-foot b{font:800 13px var(--heading);color:#0C3C8F}
.cv-foot span{font:700 11.5px var(--body);color:#E4760B}

/* new back cover */
.bk-kick{position:absolute;left:30px;top:112px;margin:0;font:700 11px var(--heading);letter-spacing:1.4px;text-transform:uppercase;color:#FFA640}
.pg .bk-h{position:absolute;left:30px;right:30px;top:132px;margin:0;font:800 36px/1.08 var(--heading);letter-spacing:-.8px;color:#fff}
.bk-h em{font-style:normal;color:#FFA640}
.bk-path{position:absolute;left:30px;right:30px;top:232px;display:flex}
.bk-path div{flex:1;position:relative;background:rgba(255,255,255,.12);padding:10px 14px 10px 22px;font:600 10.5px/1.3 var(--heading);color:#fff;
  clip-path:polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%, 12px 50%);margin-left:-6px;display:flex;align-items:center;gap:7px;min-height:52px}
.bk-path div:first-child{clip-path:polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%);margin-left:0;padding-left:12px}
.bk-path div:last-child{background:#F28C1B}
.bk-path i{font-style:normal;flex:none;width:20px;height:20px;border-radius:50%;background:#fff;color:#0C3C8F;display:grid;place-items:center;font:800 10px var(--heading)}
.bk-card{position:absolute;left:30px;top:318px;width:236px;background:#fff;color:#1B2433;border-radius:14px;padding:16px 16px 8px;box-shadow:0 18px 40px rgba(0,0,0,.28)}
.bk-cta{display:inline-block;background:#F28C1B;color:#fff;font:700 11px var(--heading);padding:6px 12px;border-radius:999px;margin-bottom:8px}
.bk-card .row{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid #E6ECF5}
.bk-card .row:first-of-type{border-top:0}
.bk-card small{display:block;font-size:9px;font-weight:700;color:#6B778A;letter-spacing:.3px;margin-bottom:2px}
.bk-card a, .bk-card .ph{font:700 12px var(--heading);color:#0C3C8F;text-decoration:none;display:block;font-style:normal;letter-spacing:-.1px}
.bk-card a:hover{text-decoration:underline}
.bk-mascot{position:absolute;right:-8px;bottom:44px;width:178px}
.bk-foot{position:absolute;left:0;right:0;bottom:0;height:46px;background:#F28C1B;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-size:10px;color:#fff}
.bk-foot b{font:800 12px var(--heading)}
</style>
</head>
<body>
<main class="viewer" id="viewer" aria-label="WeGrow B School brochure">
  <div class="stage" id="stage"><div class="scaler" id="scaler"><div class="book" id="book"></div></div></div>
</main>
<nav class="bar" aria-label="Page navigation">
  <button class="btn" id="prev" aria-label="Previous page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Back</button>

const N = PAGES.length;
const book = document.getElementById('book'), scaler = document.getElementById('scaler'), stage = document.getElementById('stage');
const where = document.getElementById('where'), dotsEl = document.getElementById('dots');
const prevB = document.getElementById('prev'), nextB = document.getElementById('next');
let mode = null, leaves = [], cur = 0, page = 0; // page = index of first visible page

function build(newMode){
  mode = newMode; book.innerHTML = ''; leaves = [];
  book.className = 'book ' + mode;
  if(mode === 'spread'){
    book.style.width = PW*2 + 'px'; book.style.height = PH + 'px';
    for(let i=0;i<N;i+=2){
      const l = document.createElement('div'); l.className='leaf';
      l.style.cssText = `left:${PW}px;width:${PW}px;height:${PH}px`;
      l.innerHTML = `<div class="face front">${PAGES[i]}</div><div class="face back">${PAGES[i+1]||'<div class="pg blank"></div>'}</div>`;
      book.appendChild(l); leaves.push(l);
    }
    cur = Math.min(Math.ceil(page/2), leaves.length);
  } else {
    book.style.width = PW + 'px'; book.style.height = PH + 'px';
    PAGES.forEach(p=>{
      const l = document.createElement('div'); l.className='leaf';
      l.style.cssText = `left:0;width:${PW}px;height:${PH}px`;
      l.innerHTML = `<div class="face front">${p}</div><div class="face back"><div class="pg blank"></div></div>`;
      book.appendChild(l); leaves.push(l);
    });
    cur = Math.min(page, N-1);
  }
  leaves.forEach((l,i)=>{ l.addEventListener('transitionend', e=>{ if(e.propertyName==='transform') setZ(); }); });
  dotsEl.innerHTML = '';
  const stops = mode==='spread' ? leaves.length+1 : N;
  for(let i=0;i<stops;i++){ const d=document.createElement('button'); d.className='dot'; d.setAttribute('aria-label','Go to '+label(i)); d.onclick=()=>go(i); dotsEl.appendChild(d); }
  render(true);
}
function max(){ return mode==='spread' ? leaves.length : N-1; }
function label(i){
  if(mode==='spread'){ if(i===0) return 'Cover'; if(i===leaves.length) return 'Back cover'; return `Pages ${i*2}–${i*2+1}`; }
  if(i===0) return 'Cover'; if(i===N-1) return 'Back cover'; return 'Page '+(i+1);
}
function setZ(active){
  leaves.forEach((l,i)=>{
    const f = i < cur;
    if(mode === 'single'){
      l.style.zIndex = (active!==undefined && i===active) ? 999 : (i === cur ? 100 : (f ? i : leaves.length - i));
    } else {
      l.style.zIndex = (active!==undefined && i===active) ? 999 : (f ? i+1 : leaves.length*2 - i);
    }
  });
}
function render(instant){
  leaves.forEach((l,i)=>{
    if(instant) l.style.transition='none';
    l.classList.toggle('flipped', i < cur);
    if(instant){ l.offsetHeight; l.style.transition=''; }
  });
  if(mode==='spread'){
    const shift = cur===0 ? -PW/2 : cur===leaves.length ? PW/2 : 0;
    if(instant) book.style.transition='none';
    book.style.transform = `translateX(${shift}px)`;
    if(instant){ book.offsetHeight; book.style.transition=''; }
    page = cur===0 ? 0 : Math.min(cur*2-1, N-1);
  } else {
    if(instant) book.style.transition='none';
    book.style.transform = 'none';
    if(instant){ book.offsetHeight; book.style.transition=''; }
    page = cur;
  }
  if(instant) setZ();
  where.textContent = label(cur);
  [...dotsEl.children].forEach((d,i)=>d.classList.toggle('on', i===cur));
  prevB.disabled = cur===0; nextB.disabled = cur===max();
}
function go(target){
  target = Math.max(0, Math.min(max(), target));
  if(target===cur) return;
  const step = target>cur ? 1 : -1;
  const run = () => {
    if(cur===target) return;
    const idx = step>0 ? cur : cur-1;
    cur += step; setZ(idx); render(false);
    if(cur!==target) setTimeout(run, 180);
  };
  run();
}
const next = ()=>go(cur+1), prev = ()=>go(cur-1);
prevB.onclick = prev; nextB.onclick = next;
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight' || e.key==='PageDown') { e.preventDefault(); next(); }
  if(e.key==='ArrowLeft' || e.key==='PageUp') { e.preventDefault(); prev(); }
  if(e.key==='Home') go(0); if(e.key==='End') go(max());
});
// click / tap / swipe on the book
let sx=null, sy=null;
book.addEventListener('pointerdown', e=>{ sx=e.clientX; sy=e.clientY; });
book.addEventListener('pointerup', e=>{
  if(sx===null) return;
  const dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
  if(e.target.closest('a')) return;
  if(Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)){ dx<0 ? next() : prev(); return; }
  if(Math.abs(dx)<8 && Math.abs(dy)<8){
    const r = book.getBoundingClientRect();
    const mid = r.left + r.width/2;
    e.clientX > mid ? next() : prev();
  }
});

function fit(){
  const viewer = document.getElementById('viewer');
  if(!viewer) return;
  const vw = viewer.clientWidth, vh = viewer.clientHeight;
  const want = (vw >= 820 && vw > vh) ? 'spread' : 'single';
  const small = vw < 760;
  if(want!==mode) build(want);
  const bw = mode==='spread' ? PW*2 : PW;
  const padX = small ? 16 : 32;
  const padY = small ? 12 : 24;
  const maxScale = mode==='single' ? 1.4 : 1.55;
  const s = Math.min((vw - padX) / bw, (vh - padY) / PH, maxScale);
  scaler.style.transform = `scale(${s})`;
  stage.style.width = bw*s + 'px'; stage.style.height = PH*s + 'px';
}
window.addEventListener('resize', fit);
fit();
</script>
