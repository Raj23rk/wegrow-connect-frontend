<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WeGrow — Business Transformation Meetup Feedback QR Code</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --navy-900: #101B4B;
      --navy-800: #1B2A6E;
      --navy-700: #233A8C;
      --orange-500: #F26A1B;
      --orange-600: #D4540C;
      --orange-050: #FFF2E8;
      --cream-50: #FBF9F5;
      --white: #FFFFFF;
      --ink: #161B2E;
      --ink-soft: #4B5170;
      --line: #E2DCD0;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background:
        radial-gradient(1100px 500px at 15% -10%, #223a9c 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #0f1730 0%, transparent 60%),
        var(--navy-900);
      color: var(--white);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 40px;
    }
    .card {
      background: var(--cream-50);
      color: var(--ink);
      border-radius: 24px;
      border: 1px solid var(--line);
      box-shadow: 0 30px 60px -25px rgba(6, 10, 30, 0.7);
      max-width: 460px;
      width: 100%;
      padding: 36px 28px 28px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .accent-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--orange-500), var(--navy-700));
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--orange-050);
      color: var(--orange-600);
      border: 1px solid #F3D3AC;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .logo-badge {
      width: 130px;
      height: auto;
      margin: 0 auto 16px;
      display: block;
    }
    h1 {
      font-family: 'Sora', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: var(--navy-900);
      line-height: 1.25;
      margin-bottom: 6px;
    }
    h1 span {
      color: var(--orange-500);
    }
    .subtitle {
      font-size: 13.5px;
      color: var(--ink-soft);
      margin-bottom: 22px;
      line-height: 1.5;
    }
    .qr-box {
      background: #FFFFFF;
      padding: 16px;
      border-radius: 20px;
      display: inline-block;
      box-shadow: 0 10px 25px rgba(19, 28, 58, 0.08);
      border: 2px solid var(--line);
      margin-bottom: 18px;
      transition: transform 0.2s ease;
    }
    .qr-box:hover {
      transform: scale(1.02);
    }
    #qrcode-canvas {
      display: flex;
      justify-content: center;
    }
    .url-pill {
      background: #F4EFE6;
      border: 1px solid #E2DCD0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      font-family: monospace;
      color: var(--navy-900);
      font-weight: 600;
      word-break: break-all;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .btn {
      appearance: none;
      border: none;
      cursor: pointer;
      font-family: 'Sora', sans-serif;
      font-weight: 700;
      font-size: 14px;
      padding: 13px 20px;
      border-radius: 10px;
      background: var(--orange-500);
      color: #FFFFFF;
      width: 100%;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
      margin-bottom: 10px;
      box-shadow: 0 4px 12px rgba(242, 106, 27, 0.25);
    }
    .btn:hover {
      background: var(--orange-600);
    }
    .btn-secondary {
      background: transparent;
      color: var(--navy-800);
      border: 1.5px solid #D7D0C0;
      box-shadow: none;
    }
    .btn-secondary:hover {
      background: #FFFFFF;
      border-color: var(--navy-800);
    }
    .copy-toast {
      display: none;
      font-size: 12px;
      color: #1E8A5F;
      font-weight: 700;
      margin-top: 4px;
      margin-bottom: 8px;
    }
    .footer-links {
      margin-top: 16px;
      display: flex;
      gap: 16px;
      justify-content: center;
      font-size: 13px;
    }
    .footer-links a {
      color: #8D99C7;
      text-decoration: none;
      font-weight: 600;
    }
    .footer-links a:hover {
      color: var(--orange-500);
      text-decoration: underline;
    }
    @media print {
      body {
        background: #ffffff;
        color: #000000;
        padding: 0;
      }
      .card {
        box-shadow: none;
        border: 2px solid #000;
        max-width: 100%;
      }
      .btn, .footer-links {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="accent-top"></div>
    
    <div class="badge">Scan To Give Feedback</div>

    <h1>Business <span>Transformation</span> Meetup</h1>
    <p class="subtitle">Scan this QR code with any mobile camera or scanner app to share your feedback.</p>

    <!-- QR Code Preview -->
    <div class="qr-box">
      <div id="qrcode-canvas"></div>
    </div>

    <!-- Scannable URL info -->
    <div class="url-pill">
      <span id="targetUrlText">https://www.wegrowbschool.in/feedback</span>
      <button 
        type="button" 
        onclick="copyUrl()" 
        style="background:none;border:none;cursor:pointer;color:var(--orange-600);font-weight:700;font-size:11px;"
      >
        Copy
      </button>
    </div>
    <div class="copy-toast" id="copyToast">✓ Link copied to clipboard!</div>

    <!-- Actions -->
    <a href="/feedback.html" class="btn">
      Open Feedback Form Online →
    </a>

    <button type="button" onclick="window.print()" class="btn btn-secondary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2m-12 0v4h12v-4"/>
      </svg>
      Print Meetup Poster / Standee
    </button>
  </div>

  <div class="footer-links">
    <a href="/feedback.html">Feedback Form</a>
    <span>•</span>
    <a href="/">WeGrow Connect</a>
    <span>•</span>
    <a href="javascript:window.print()">Print Standee</a>
  </div>

  <script>
    const targetUrl = window.location.origin.includes('localhost') || window.location.origin.includes('127.0.0.1')
      ? window.location.origin + '/feedback.html'
      : (window.location.origin + '/feedback');

    document.getElementById("targetUrlText").innerText = targetUrl;

    if (typeof QRCode !== 'undefined') {
      new QRCode(document.getElementById("qrcode-canvas"), {
        text: targetUrl,
        width: 220,
        height: 220,
        colorDark: "#101B4B",
        colorLight: "#FFFFFF",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    function copyUrl() {
      const url = document.getElementById("targetUrlText").innerText;
      navigator.clipboard.writeText(url).then(() => {
        const toast = document.getElementById("copyToast");
        toast.style.display = "block";
        setTimeout(() => { toast.style.display = "none"; }, 2500);
      });
    }
  </script>
</body>
</html>
