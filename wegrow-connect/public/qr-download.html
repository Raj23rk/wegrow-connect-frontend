<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sing Along Live Event - Booking QR Code</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #f59e0b;
      --secondary: #ec4899;
      --bg: #0b0f19;
      --card: #111827;
      --text: #f9fafb;
      --muted: #9ca3af;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0b0f19 75%);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .poster-card {
      background: #131929;
      border: 1.5px solid rgba(245, 158, 11, 0.35);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 40px rgba(245, 158, 11, 0.15);
      border-radius: 28px;
      max-width: 440px;
      width: 100%;
      padding: 36px 28px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .poster-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #f59e0b, #ec4899, #8b5cf6, #3b82f6);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.4);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 900;
      line-height: 1.2;
      background: linear-gradient(135deg, #ffffff 30%, #fde68a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 24px;
    }
    .qr-frame {
      background: #ffffff;
      padding: 16px;
      border-radius: 20px;
      display: inline-block;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      margin-bottom: 20px;
      transition: transform 0.2s ease;
    }
    .qr-frame:hover {
      transform: scale(1.02);
    }
    .qr-image {
      width: 240px;
      height: 240px;
      display: block;
    }
    .url-chip {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 10px 14px;
      font-family: monospace;
      font-size: 13px;
      color: #60a5fa;
      word-break: break-all;
      margin-bottom: 20px;
    }
    .contact-box {
      background: rgba(34, 197, 94, 0.1);
      border: 1px dashed rgba(34, 197, 94, 0.35);
      border-radius: 14px;
      padding: 10px;
      font-size: 12px;
      color: #86efac;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 20px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #111827;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
    }
    @media print {
      body {
        background: #ffffff;
        color: #000000;
      }
      .poster-card {
        border: 2px solid #000;
        box-shadow: none;
        background: #fff;
        color: #000;
      }
      .badge, .btn-group {
        display: none !important;
      }
      h1 {
        color: #000;
        -webkit-text-fill-color: #000;
      }
      .subtitle, .url-chip, .contact-box {
        color: #111;
        border-color: #ccc;
      }
    }
  </style>
</head>
<body>

  <div class="poster-card">
    <div class="badge">
      <span>🎵</span> Official Booking QR
    </div>

    <h1>SING ALONG LIVE</h1>
    <p class="subtitle">Scan to Book Tickets Online Instantly</p>

    <div class="qr-frame">
      <img src="/sing_along_page_qr.png" alt="Sing Along Booking QR Code" class="qr-image" id="qrImg" />
    </div>

    <div class="url-chip">
      https://www.wegrowbschool.in/sing-along
    </div>

    <div class="contact-box">
      <span>📞 Booking Helpline:</span>
      <strong>+91 93440 37331</strong>
    </div>

    <div class="btn-group">
      <a href="/sing_along_qr_highres.png" download="sing_along_qr_2048x2048.png" class="btn btn-primary">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        Download High-Res PNG (2048×2048)
      </a>

      <a href="/sing_along_qr.svg" download="sing_along_qr_vector.svg" class="btn btn-secondary">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        Download Vector SVG (Print Ready)
      </a>

      <button onclick="window.print()" class="btn btn-secondary">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2m-12 0v4h12v-4"/></svg>
        Print Event Poster
      </button>
    </div>
  </div>

</body>
</html>
